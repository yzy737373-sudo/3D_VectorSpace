s=\"angle-badge\" id=\"angleBadge\">尚未折起<\/span><\/div>\n<div class=\"scene-wrap\"><canvas class=\"scene-canvas\" id=\"space\" tabindex=\"0\" role=\"img\" aria-label=\"菱形折叠的三维图。拖动旋转，滚轮缩放；聚焦后也可用方向键旋转。\"><\/canvas><div class=\"scene-note\">拖动旋转 · 滚轮缩放 · 方向键也可调整<\/div><\/div>\n<div class=\"scene-legend\"><span><i class=\"swatch\" style=\"background:#8eb9c9\"><\/i>固定底面 BCD<\/span><span><i class=\"swatch\" style=\"background:#e9a17e\"><\/i>折起的 △PBD<\/span><span id=\"planeLegend\" hidden><i class=\"swatch\" style=\"background:#acd3bc\"><\/i>垂直 BD 的截面<\/span><span id=\"sphereLegend\" hidden><i class=\"swatch\" style=\"background:#b9a2d8\"><\/i>外接球<\/span><\/div>\n<div class=\"control-panel\">\n<div id=\"foldControls\"><div class=\"control-label\"><label for=\"fold\">沿 BD 折起<\/label><output id=\"foldValue\" for=\"fold\">0° / 120°<\/output><\/div><input type=\"range\" id=\"fold\" min=\"0\" max=\"120\" step=\"0.1\" value=\"0\" aria-label=\"绕 BD 折起的角度，0 到 120 度\"><div class=\"range-ends\"><span>A 的原位置<\/span><span>到达题设位置 P<\/span><\/div><\/div>\n<div id=\"centerControls\" hidden><div class=\"control-label\"><label for=\"center\">球心沿 OM 的反向移动<\/label><output id=\"centerValue\" for=\"center\">OS＝0<\/output><\/div><input type=\"range\" id=\"center\" min=\"0\" max=\"100\" step=\"0.1\" value=\"0\" aria-label=\"球心从 O 移至等距位置的进度\"><div class=\"range-ends\"><span>S 暂放在 O<\/span><span>SB＝SC＝SP＝SD<\/span><\/div><\/div>\n<div id=\"lockedControls\" class=\"locked-controls\" hidden><p id=\"lockedText\">折叠已固定在题设的 60°。<\/p><button id=\"sectionView\" type=\"button\">正对截面<\/button><\/div>\n<\/div>\n<\/section>\n<aside class=\"lesson-panel\" aria-label=\"当前步骤的思路与计算\">\n<div class=\"chapter\" id=\"chapter\">STEP 01 / 05<\/div><h2 id=\"lessonTitle\">先把菱形的长度找出来<\/h2><div id=\"lessonContent\"><\/div>\n<div class=\"section-head\"><strong id=\"sectionTitle\">俯视：两条对角线垂直平分<\/strong><span id=\"sectionHint\">O＝AC ∩ BD<\/span><\/div>\n<canvas class=\"section-canvas\" id=\"section\" role=\"img\" aria-label=\"当前步骤对应的平面截面示意图\"><\/canvas>\n<p class=\"section-caption\" id=\"sectionCaption\"><\/p>\n<div class=\"equality\" id=\"equality\" hidden><span><i class=\"tiny-dot\" style=\"background:#be9252\"><\/i><span id=\"sbValue\">SB²＝3.000<\/span><\/span><span><i class=\"tiny-dot\" style=\"background:#137c72\"><\/i><span id=\"scValue\">SC²＝1.000<\/span><\/span><\/div>\n<\/aside>\n<\/div>\n<div class=\"footer-controls\"><div class=\"play-group\"><button class=\"primary\" id=\"play\" type=\"button\">▶ 自动演示<\/button><span class=\"auto-state\" id=\"autoState\">跟着五步，看一遍完整思路<\/span><\/div><div class=\"navigation\"><button id=\"previous\" type=\"button\" disabled>← 上一步<\/button><button id=\"next\" type=\"button\">下一步 →<\/button><\/div><\/div>\n<div class=\"footer-line\"><span>核心方法：二面角 → 垂直截面 → 球心等距 → 勾股定理<\/span><span>长度与球面均按真实几何关系绘制<\/span><\/div>\n<p class=\"screen-reader\" id=\"announce\" aria-live=\"polite\"><\/p>\n<\/main>\n<script>\n(() => {\n'use strict';\nconst $ = id => document.getElementById(id);\nconst sqrt3 = Math.sqrt(3), radius = Math.sqrt(13/3), targetOS = 2/sqrt3;\nconst state = {step:0,fold:0,center:0,sphere:0,yaw:.35,pitch:.54,zoom:1,front:false,playing:false};\nconst B = [-sqrt3,0,0], D = [sqrt3,0,0], C = [0,1,0], O = [0,0,0], A = [0,-1,0];\nconst palette = {ink:'#26373b',muted:'#718080',grid:'#e5e9e0',blue:'#528ba8',orange:'#df7743',teal:'#137c72',purple:'#8366b8',gold:'#be9252',paper:'#fffefb'};\nconst lessons = [\n{title:'先把菱形的长度找出来',scene:'原始菱形 ABCD',section:'俯视：两条对角线垂直平分',hint:'O＝AC ∩ BD',caption:'△ABO 是 30°–60°–90° 直角三角形。',html:`<p class=\"lead\">设两条对角线交于 O。菱形的对角线互相垂直平分，而且 AC 平分 ∠A。<\/p><div class=\"math-stack\"><div class=\"math-row math\">∠BAO＝60°，AB＝2<\/div><div class=\"math-row math\">AO＝2 cos 60°＝1<\/div><div class=\"math-row math\">BO＝2 sin 60°＝√3<\/div><div class=\"equation math\">OC＝1，OB＝OD＝√3<\/div><\/div><div class=\"callout\">后面一直用到的只有这两个长度：<strong>1 和 √3<\/strong>。<\/div>`},\n{title:'二面角，就是截面里的 ∠POC',scene:'△ABD 沿 BD 折起',section:'截面：与棱 BD 垂直',hint:'∠POC＝二面角',caption:'拖动折叠滑块，观察 P 如何绕 O 走圆弧。',html:`<p class=\"lead\">折叠不改变长度，也不改变 OP⊥BD。原来 OC⊥BD，所以 OP、OC 围成的角正是二面角的平面角。<\/p><div class=\"math-stack\"><div class=\"math-row math\">OP＝OA＝OC＝1<\/div><div class=\"math-row math\">∠POC＝60° <small>到达题设位置时<\/small><\/div><div class=\"equation math\">△OPC 是边长 1 的等边三角形<\/div><\/div><div class=\"callout\"><strong>注意两种角：<\/strong>从 A 的原位置折起 120° 后，OP 与 OC 的夹角才是 60°。<\/div>`},\n{title:'利用对称，把球心定位到一条线',scene:'用垂直截面寻找球心',section:'截面：球心 S 必须在 OM 直线上',hint:'M＝PC 中点',caption:'S 到 B、D 等距；S 到 P、C 也等距。',html:`<p class=\"lead\">设外接球球心为 S，M 是 PC 的中点。球心到四个顶点的距离都相等。<\/p><div class=\"math-stack\"><div class=\"math-row math\">SB＝SD <small>⇒ S 在 BD 的垂直平分面内<\/small><\/div><div class=\"math-row math\">SP＝SC <small>⇒ 截面内 SM⊥PC<\/small><\/div><div class=\"equation math\">S、O、M 共线<\/div><\/div><div class=\"callout\">等边三角形中 <strong>OM⊥PC<\/strong>。因此球心只能沿 OM 所在直线寻找；它的位置还要用等距条件确定。<\/div>`},\n{title:'沿着这条线，找到真正的球心',scene:'让 SB 与 SC 相等',section:'截面：S 最终在 OM 的反向延长线上',hint:'OM＝√3/2，MC＝1/2',caption:'把滑块拖到右端，比较两条半径的平方。',html:`<p class=\"lead\">若 S 在射线 OM 上，SB²−SC²＝2＋√3·OS＞0，无法等距。因此 S 在反向延长线上。令 x＝OS。<\/p><div class=\"math-stack\"><div class=\"math-row math\">SB²＝x²＋3 <small>△SOB 在 O 处直角<\/small><\/div><div class=\"math-row math\">SC²＝(x＋√3/2)²＋1/4<\/div><div class=\"math-row math\">SB²＝SC² ⇒ 3＝√3x＋1<\/div><div class=\"equation math\">OS＝2/√3，R²＝3＋4/3＝13/3<\/div><\/div><div class=\"callout\"><strong>关键：<\/strong>SM＝SO＋OM，所以括号中是加号。球心在三棱锥外部。<\/div>`},\n{title:'四个顶点，同落在一个球面上',scene:'三棱锥 P-BCD 的外接球',section:'截面：球心位置与半径已确定',hint:'SB＝SC＝SP＝SD',caption:'截面里可见 S、O、M 共线，三维图中四个顶点都在球面上。',html:`<p class=\"lead\">半径可以用 SB 来算。因为 SO⊥BD，△SOB 是直角三角形。<\/p><div class=\"math-stack\"><div class=\"math-row math\">R²＝SO²＋OB²＝4/3＋3＝13/3<\/div><div class=\"math-row math\">球表面积＝4πR²<\/div><\/div><div class=\"answer\"><small>本题答案<\/small>4π × <span class=\"frac\"><span>13<\/span><span>3<\/span><\/span> ＝ <span class=\"frac\"><span>52π<\/span><span>3<\/span><\/span><\/div><div class=\"callout\">回看这道题：空间折叠确定 <strong>∠POC<\/strong>；对称与等距确定 <strong>S<\/strong>；最后用一次勾股求 <strong>R²<\/strong>。<\/div>`}\n];\nconst space = $('space'), section = $('section');\nconst ctx = space.getContext('2d'), sctx = section.getContext('2d');\nlet width=0,height=0,sw=0,sh=0,dpr=1,drawPending=false;\nlet autoTimer=0,frame=0,animationId=0;\nconst reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst add=(a,b)=>a.map((x,i)=>x+b[i]), mul=(a,k)=>a.map(x=>x*k), lerp=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t);\nfunction pointP(){const a=state.fold*Math.PI/180;return [0,-Math.cos(a),Math.sin(a)];}\nfunction pointS(){const k=targetOS*state.center;return [0,-sqrt3*k/2,-k/2];}\nfunction drawSoon(){if(!drawPending){drawPending=true;requestAnimationFrame(()=>{drawPending=false;draw();});}}\nfunction resize(){dpr=Math.min(window.devicePixelRatio||1,2);const a=space.getBoundingClientRect(),b=section.getBoundingClientRect();width=a.width;height=a.height;sw=b.width;sh=b.height;for(const [canvas,w,h]of[[space,width,height],[section,sw,sh]]){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}drawSoon();}\nnew ResizeObserver(resize).observe(space);new ResizeObserver(resize).observe(section);\nfunction projection(){\nconst yaw=state.yaw,pitch=state.pitch,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);\nconst center=state.step===4?lerp([0,0,.05],[0,-.68,-.29],state.sphere):[0,0,.12];\nconst scale=Math.min(width/(state.step===4?5.7:4.65),height/(state.step===4?5.5:3.6))*state.zoom;\nconst p=v=>{let x=v[0]-center[0],y=v[1]-center[1],z=v[2]-center[2];return [width/2+scale*(cy*x-sy*y),height/2+scale*(sp*(sy*x+cy*y)-cp*z)];};\np.depth=v=>cp*(sy*v[0]+cy*v[1])+sp*v[2];p.scale=scale;return p;\n}\nfunction path2(c,pts,close=false){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(close)c.closePath();}\nfunction line(c,a,b,color,width=1.5,dash=[]){c.save();c.strokeStyle=color;c.lineWidth=width;c.setLineDash(dash);path2(c,[a,b]);c.stroke();c.restore();}\nfunction poly(c,pts,fill,stroke,lineWidth=1.4,dash=[]){c.save();path2(c,pts,true);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lineWidth;c.setLineDash(dash);c.stroke();}c.restore();}\nfunction label(c,text,p,dx=0,dy=0,color=palette.ink,size=15,align='center'){c.save();c.font=`500 ${size}px \"Segoe UI\",\"Microsoft YaHei\",sans-serif`;c.textAlign=align;c.textBaseline='middle';c.lineWidth=4;c.lineJoin='round';c.strokeStyle=palette.paper;c.strokeText(text,p[0]+dx,p[1]+dy);c.fillStyle=color;c.fillText(text,p[0]+dx,p[1]+dy);c.restore();}\nfunction dot(c,p,color,r=3.5){c.beginPath();c.arc(p[0],p[1],r,0,Math.PI*2);c.fillStyle=color;c.fill();c.strokeStyle=palette.paper;c.lineWidth=1.5;c.stroke();}\nfunction arc3(c,p,r,start,end,color,width=2.2){const pts=[];for(let i=0;i<=50;i++){const t=start+(end-start)*i/50;pts.push(p([0,r*Math.cos(t),r*Math.sin(t)]));}c.save();c.lineWidth=width;c.strokeStyle=color;path2(c,pts);c.stroke();c.restore();}\nfunction right3(c,p,v,a,b,size=.10,color=palette.muted){const aa=mul(a,size),bb=mul(b,size);poly(c,[p(add(v,aa)),p(add(add(v,aa),bb)),p(add(v,bb))],null,color,1);}\nfunction drawSphere(p,S){\nconst a=state.sphere;if(a<=.001)return;\nctx.save();ctx.globalAlpha=a;const sc=p(S),r=radius*p.scale;\nconst g=ctx.createRadialGradient(sc[0]-r*.3,sc[1]-r*.3,r*.1,sc[0],sc[1],r);g.addColorStop(0,'#b8a4da0b');g.addColorStop(1,'#9677c120');ctx.beginPath();ctx.arc(sc[0],sc[1],r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#9e83c386';ctx.lineWidth=1.5;ctx.stroke();\nfor(let j=0;j<6;j++){const ph=j*Math.PI/6;const pts=[];for(let i=0;i<=100;i++){const t=i*Math.PI*2/100;pts.push(p(add(S,[radius*Math.sin(t)*Math.cos(ph),radius*Math.sin(t)*Math.sin(ph),radius*Math.cos(t)])));}ctx.strokeStyle='#9982ba35';ctx.lineWidth=.8;path2(ctx,pts);ctx.stroke();}\nfor(const t of[-Math.PI/4,0,Math.PI/4]){const pts=[];for(let i=0;i<=100;i++){const ph=i*Math.PI*2/100;pts.push(p(add(S,[radius*Math.cos(t)*Math.cos(ph),radius*Math.cos(t)*Math.sin(ph),radius*Math.sin(t)])));}ctx.strokeStyle='#9982ba45';path2(ctx,pts);ctx.stroke();}\nctx.restore();\n}\nfunction drawSpace(){\nctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const p=projection(),P=pointP(),S=pointS(),M=mul(add(P,C),.5),advanced=state.step>=2;\nctx.save();\n// A quiet grid helps the folded face read as a spatial object.\nfor(let i=-2;i<=2;i++){line(ctx,p([i,-1.35,0]),p([i,1.4,0]),'#ebeee7',.75);line(ctx,p([-2.1,i*.6,0]),p([2.1,i*.6,0]),'#ebeee7',.75);}\nif(state.step===4)drawSphere(p,S);\nif(advanced){poly(ctx,[[0,-1.45,-.95],[0,1.35,-.95],[0,1.35,1.3],[0,-1.45,1.3]].map(p),'#7ab7980c','#94bfa055',1,[5,5]);}\nif(state.fold>2&&!advanced){poly(ctx,[B,A,D].map(p),null,'#b5c0ba77',1,[5,5]);line(ctx,p(A),p(O),'#a1afa47a',1,[4,5]);label(ctx,'A 原位置',p(A),21,6,'#8b9891',12);arc3(ctx,p,1,Math.PI-state.fold*Math.PI/180,Math.PI,'#dfa37f55',1.2);}\nconst faces=[{v:[B,C,D],fill:'#83b4ca37',stroke:palette.blue},{v:[B,P,D],fill:'#e9a17e4e',stroke:palette.orange}];\nfaces.sort((a,b)=>a.v.reduce((n,v)=>n+p.depth(v),0)-b.v.reduce((n,v)=>n+p.depth(v),0));faces.forEach(f=>poly(ctx,f.v.map(p),f.fill,f.stroke,1.7));\nif(advanced){poly(ctx,[O,C,P].map(p),'#cce5cf4a',null);line(ctx,p(P),p(C),'#708c815e',1.25,[4,4]);}\nline(ctx,p(B),p(D),palette.ink,2.5);\nline(ctx,p(O),p(C),palette.teal,2.2);line(ctx,p(O),p(P),palette.orange,2.2);\nif(state.step===0){line(ctx,p(A),p(C),palette.teal,2);right3(ctx,p,O,[1,0,0],[0,1,0]);label(ctx,'1',p([0,.55,0]),-13,3,palette.teal,14);label(ctx,'1',p([0,-.55,0]),14,-3,palette.teal,14);label(ctx,'√3',p(mul(B,.53)),4,14,palette.ink,14);label(ctx,'√3',p(mul(D,.53)),4,-14,palette.ink,14);label(ctx,'2',p(mul(add(A,B),.5)),-14,-10,palette.orange,14);}\nif(state.step===1){const alpha=Math.PI-state.fold*Math.PI/180;if(alpha>.01){arc3(ctx,p,.3,0,alpha,palette.teal,2);const k=alpha/2;label(ctx,`${Math.round(alpha*180/Math.PI)}°`,p([0,.49*Math.cos(k),.49*Math.sin(k)]),10,-2,palette.teal,13);}right3(ctx,p,O,[1,0,0],[0,1,0],.12);label(ctx,'1',p(mul(P,.64)),-15,-4,palette.orange,13);label(ctx,'1',p(mul(C,.61)),0,14,palette.teal,13);}\nif(advanced){line(ctx,p([0,-1.2,-1.2/sqrt3]),p([0,1.05,1.05/sqrt3]),'#739c87',1.3,[5,5]);line(ctx,p(O),p(M),palette.teal,1.6);const v=mul(add(P,mul(C,-1)),1);right3(ctx,p,M,[0,-sqrt3/2,-.5],v,.095);dot(ctx,p(M),palette.teal,3);label(ctx,'M',p(M),14,4,palette.teal,14);}\nif(state.step>=3){line(ctx,p(S),p(B),palette.gold,2.1);line(ctx,p(S),p(C),palette.teal,2.1);line(ctx,p(S),p(P),palette.purple,1.5,[4,4]);line(ctx,p(S),p(D),'#8e83a4',1.1,[4,4]);line(ctx,p(S),p(O),palette.purple,2);right3(ctx,p,O,[-1,0,0],[0,-sqrt3/2,-.5],.12,palette.purple);dot(ctx,p(S),palette.purple,5);label(ctx,'S',p(S),-12,16,palette.purple,16);if(state.step===4)label(ctx,'R',p(mul(add(S,B),.5)),-10,12,palette.gold,14);}\nfor(const [name,pt,col,dx,dy]of[['B',B,palette.ink,-14,5],['D',D,palette.ink,14,5],['C',C,palette.blue,8,18]]){dot(ctx,p(pt),col);label(ctx,name,p(pt),dx,dy,col,16);}\ndot(ctx,p(O),palette.teal,3.5);label(ctx,'O',p(O),-10,15,palette.teal,14);\ndot(ctx,p(P),palette.orange,4);label(ctx,state.fold<.2?'A':'P',p(P),7,-17,palette.orange,16);\nctx.restore();\n}\nfunction drawSection(){\nsctx.setTransform(dpr,0,0,dpr,0,0);sctx.clearRect(0,0,sw,sh);\nif(state.step===0){\nconst scale=Math.min((sw-65)/(2*sqrt3),(sh-48)/2),cx=sw/2,cy=sh/2;const p=v=>[cx+v[0]*scale,cy+v[1]*scale];\npoly(sctx,[A,B,C,D].map(p),'#e7efdf35','#95aba1',1.5);line(sctx,p(A),p(C),palette.teal,1.6);line(sctx,p(B),p(D),palette.ink,1.6);poly(sctx,[p([0,.13,0]),p([.13,.13,0]),p([.13,0,0])],null,palette.muted,1);\nfor(const[name,v,dx,dy]of[['A',A,0,-15],['B',B,-15,0],['C',C,0,15],['D',D,15,0],['O',O,-9,-10]]){dot(sctx,p(v),palette.teal,2.5);label(sctx,name,p(v),dx,dy,palette.ink,13);}\nlabel(sctx,'1',p([0,-.55,0]),14,0,palette.teal,12);label(sctx,'1',p([0,.55,0]),14,0,palette.teal,12);label(sctx,'√3',p(mul(B,.5)),0,14,palette.ink,12);label(sctx,'√3',p(mul(D,.5)),0,14,palette.ink,12);return;\n}\nconst P=pointP(),S=pointS(),M=mul(add(P,C),.5),advanced=state.step>=2;\nconst ext=advanced?2.7:2.5;const scale=Math.min((sw-57)/ext,(sh-50)/(advanced?1.9:1.5));const ox=advanced?sw*.49:sw*.5,oy=advanced?sh*.58:sh*.7;const p=v=>[ox+v[1]*scale,oy-v[2]*scale];\nif(state.step===1){const pts=[];for(let i=0;i<=70;i++){const a=i*Math.PI/70;pts.push(p([0,Math.cos(a),Math.sin(a)]));}sctx.strokeStyle='#c2cfc4';sctx.lineWidth=1;sctx.setLineDash([3,5]);path2(sctx,pts);sctx.stroke();sctx.setLineDash([]);dot(sctx,p(A),'#adb9ae',2.5);label(sctx,'A',p(A),-8,14,palette.muted,12);}\npoly(sctx,[O,C,P].map(p),'#a4ceb82a',null);line(sctx,p(O),p(C),palette.teal,2);line(sctx,p(O),p(P),palette.orange,2);if(advanced)line(sctx,p(C),p(P),palette.ink,1.6);\nconst alpha=Math.PI-state.fold*Math.PI/180;const pts=[];for(let i=0;i<=30;i++){const a=alpha*i/30;pts.push(p([0,.25*Math.cos(a),.25*Math.sin(a)]));}sctx.strokeStyle=palette.teal;sctx.lineWidth=1.5;path2(sctx,pts);sctx.stroke();if(!advanced)label(sctx,`${Math.round(alpha*180/Math.PI)}°`,p([0,.43*Math.cos(alpha/2),.43*Math.sin(alpha/2)]),0,-3,palette.teal,12);\nif(advanced){line(sctx,p([0,-1.25,-1.25/sqrt3]),p([0,1.15,1.15/sqrt3]),'#8dae98',1,[4,4]);dot(sctx,p(M),palette.teal,2.5);label(sctx,'M',p(M),12,6,palette.teal,13);const u=[0,.5,-sqrt3/2],v=[0,-sqrt3/2,-.5];poly(sctx,[p(add(M,mul(u,.09))),p(add(add(M,mul(u,.09)),mul(v,.09))),p(add(M,mul(v,.09)))],null,palette.muted,1);}\nif(state.step>=3){line(sctx,p(S),p(C),palette.teal,1.7);line(sctx,p(S),p(P),palette.purple,1.2,[4,4]);line(sctx,p(S),p(O),palette.purple,2.1);dot(sctx,p(S),palette.purple,4);label(sctx,'S',p(S),-10,13,palette.purple,14);if(state.center>.3)label(sctx,'x',p(mul(S,.52)),-7,-10,palette.purple,13);}\ndot(sctx,p(O),palette.teal,3);dot(sctx,p(C),palette.teal,3);dot(sctx,p(P),palette.orange,3);label(sctx,'O',p(O),-10,11,palette.teal,13);label(sctx,'C',p(C),10,5,palette.teal,13);label(sctx,'P',p(P),0,-14,palette.orange,13);label(sctx,'1',p(mul(C, x 11px}.scene-wrap{height:320px}.scene-top{padding:15px 14px 0}.scene-title{font-size:12px}.status-badge{font-size:11px}.lesson-panel{padding:18px}.control-panel{padding:13px 15px}.scene-legend{padding-left:15px;gap:8px 13px;font-size:11px}.scene-note{left:14px}.problem{display:block}.problem strong{display:block;margin-bottom:6px}.play-group button{font-size:13px}.navigation{gap:5px}.navigation button{font-size:13px;padding:9px}.step-name{font-size:10px}.math-row{font-size:15px}.equation{font-size:16px}.detail-head{flex-wrap:wrap}.control-label{font-size:12px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<style>.app{padding-top:22px!important}<\/style>\n<\/head>\n<body>\n<main class=\"app\">\n<header><div><div class=\"eyebrow\">空间向量 · 动画解题<\/div><h1>把向量条件，变成一个中点<\/h1><p>三个向量合成一条线，再用高度比读出体积比。<\/p><\/div><div class=\"header-mark\" aria-hidden=\"true\">→<\/div><\/header>\n<div class=\"problem\"><strong>题目<\/strong><p>在四面体 ABCD 中，P 为空间中一点，且满足 <span class=\"nowrap\">3<span class=\"vec\">PA<\/span>＋<span class=\"vec\">PB<\/span>＋<span class=\"vec\">PC<\/span>＋<span class=\"vec\">PD<\/span>＝<span class=\"vec\">0<\/span><\/span>。若四面体 ABCD 的体积为 4，求四面体 PBCD 的体积。<\/p><\/div>\n<nav class=\"steps\" aria-label=\"解题步骤\">\n<button class=\"step\" data-step=\"0\" aria-current=\"step\"><span class=\"number\">01<\/span><span class=\"step-name\">找到底面重心<\/span><\/button>\n<button class=\"step\" data-step=\"1\"><span class=\"number\">02<\/span><span class=\"step-name\">合并三个向量<\/span><\/button>\n<button class=\"step\" data-step=\"2\"><span class=\"number\">03<\/span><span class=\"step-name\">确定 P 的位置<\/span><\/button>\n<button class=\"step\" data-step=\"3\"><span class=\"number\">04<\/span><span class=\"step-name\">比较垂直高度<\/span><\/button>\n<button class=\"step\" data-step=\"4\"><span class=\"number\">05<\/span><span class=\"step-name\">得到体积比例<\/span><\/button>\n<\/nav>\n<div class=\"workspace\">\n<section class=\"scene-panel\" aria-label=\"可旋转的四面体动画\">\n<div class=\"scene-top\"><span class=\"scene-title\"><span class=\"live-dot\"><\/span><span id=\"sceneTitle\">先看共同底面 BCD<\/span><\/span><span class=\"status-badge\" id=\"status\">V(ABCD)＝4<\/span><\/div>\n<div class=\"scene-wrap\"><canvas id=\"space\" class=\"scene-canvas\" tabindex=\"0\" role=\"img\" aria-label=\"四面体的三维动画。拖动旋转、滚轮缩放，也可用方向键旋转。\"><\/canvas><div class=\"scene-note\">拖动旋转 · 滚轮缩放 · 方向键也可调整<\/div><\/div>\n<div class=\"scene-legend\"><span><i class=\"swatch\" style=\"background:#8eb9c9\"><\/i>共同底面 BCD<\/span><span id=\"vectorLegend\" hidden><i class=\"swatch\" style=\"background:#b7a2d1\"><\/i>PB、PC、PD<\/span><span id=\"lineLegend\"><i class=\"swatch\" style=\"background:#73b6a4\"><\/i><span id=\"lineLegendText\">底面中线<\/span><\/span><span id=\"heightLegend\" hidden><i class=\"swatch\" style=\"background:#e9a17e\"><\/i>垂直高度<\/span><span id=\"volumeLegend\" hidden><i class=\"swatch\" style=\"background:#73b6a4\"><\/i>四面体 PBCD<\/span><\/div>\n<div class=\"control-panel\">\n<div id=\"sumControls\" hidden><div class=\"control-label\"><label for=\"sum\">平移向量，首尾相接<\/label><output id=\"sumValue\" for=\"sum\">0%<\/output><\/div><input id=\"sum\" type=\"range\" min=\"0\" max=\"100\" value=\"0\" step=\"0.1\"><div class=\"range-ends\"><span>共同起点 G<\/span><span>闭合：合向量为 0<\/span><\/div><\/div>\n<div id=\"positionControls\" hidden><div class=\"control-label\"><label for=\"position\">沿 AG 移动 P<\/label><output id=\"positionValue\" for=\"position\">GP / GA＝0.50<\/output><\/div><input id=\"position\" type=\"range\" min=\"0\" max=\"100\" value=\"50\" step=\"0.1\" aria-label=\"P 的位置，GP 占 GA 的百分比\"><div class=\"range-ends\"><span>G · 0%<\/span><span>中点 · 50%<\/span><span>A · 100%<\/span><\/div><\/div>\n<div id=\"lockedControls\" class=\"locked-controls\"><p id=\"lockedText\">G 是底面 BCD 的重心。<\/p><button id=\"view\" type=\"button\">正对底面<\/button><\/div>\n<\/div>\n<\/section>\n<aside class=\"lesson-panel\" aria-label=\"当前步骤的思路与计算\">\n<div class=\"chapter\" id=\"chapter\">STEP 01 / 05<\/div><h2 id=\"lessonTitle\">先取底面 BCD 的重心 G<\/h2><div id=\"lessonContent\"><\/div>\n<div class=\"detail-head\"><strong id=\"detailTitle\">底面：三条中线交于 G<\/strong><span id=\"detailHint\">重心性质<\/span><\/div>\n<canvas id=\"detail\" class=\"detail-canvas\" role=\"img\" aria-label=\"与当前步骤同步的平面解释动画\"><\/canvas><p class=\"detail-caption\" id=\"detailCaption\"><\/p>\n<\/aside>\n<\/div>\n<div class=\"footer-controls\"><div class=\"play-group\"><button id=\"play\" class=\"primary\" type=\"button\">▶ 自动演示<\/button><span id=\"autoState\" class=\"auto-state\">跟着五步，看一遍完整思路<\/span><\/div><div class=\"navigation\"><button id=\"previous\" type=\"button\" disabled>← 上一步<\/button><button id=\"next\" type=\"button\">下一步 →<\/button><\/div><\/div>\n<div class=\"footer-line\"><span>核心方法：底面重心 → 向量相消 → 中点 → 同底体积比<\/span><span>图形为示意；结论适用于任意非退化四面体<\/span><\/div>\n<p id=\"announce\" class=\"screen-reader\" aria-live=\"polite\"><\/p>\n<\/main>\n<script>\n(() => {\n'use strict';\nconst $=id=>document.getElementById(id),v=name=>`<span class=\"vec\">${name}<\/span>`;\nconst A=[-.6,.5,2],B=[-2,-1,0],C=[2,-1,0],D=[.4,2,0];\nconst add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,k)=>a.map(x=>x*k),lerp=(a,b,t)=>add(a,mul(sub(b,a),t));\nconst G=mul(add(add(B,C),D),1/3),H=[A[0],A[1],0],AG=sub(A,G),baseArea=6,fullVolume=4;\nconst state={step:0,t:.5,sum:0,height:0,volume:0,yaw:-.4,pitch:.38,zoom:1,front:false,playing:false};\nconst palette={ink:'#26373b',muted:'#718080',blue:'#528ba8',orange:'#df7743',teal:'#137c72',purple:'#8366b8',paper:'#fffefb'};\nconst lessons=[\n{title:'先取底面 BCD 的重心 G',scene:'先看共同底面 BCD',detail:'底面：三条中线交于 G',hint:'重心性质',caption:'G 是三条中线的交点；图形不需要是正四面体。',html:`<p class=\"lead\">两个四面体都可以把 △BCD 当作底面。面对题设中的 PB、PC、PD，先取这个三角形的重心 G。<\/p><div class=\"math-stack\"><div class=\"math-row\">三角形重心满足：<\/div><div class=\"equation math\">${v('GB')}＋${v('GC')}＋${v('GD')}＝${v('0')}<\/div><\/div><div class=\"callout\">这个性质可以把<strong>分别指向 B、C、D 的三个向量<\/strong>，合并为指向 G 的一个向量。<\/div>`},\n{title:'三个向量，合成 3 倍的 PG',scene:'从共同起点 P 出发',detail:'平移 GB、GC、GD：首尾闭合',hint:'向量平移不变',caption:'三条箭头首尾相接后回到起点，所以合向量为 0。',html:`<p class=\"lead\">每条向量都先经过 G。以 PB 为例：<\/p><div class=\"math-stack\"><div class=\"math-row math\">${v('PB')}＝${v('PG')}＋${v('GB')}<\/div><div class=\"math-row math\">${v('PB')}＋${v('PC')}＋${v('PD')}<\/div><div class=\"math-row math\">＝3${v('PG')}＋(${v('GB')}＋${v('GC')}＋${v('GD')})<\/div><div class=\"equation math\">${v('PB')}＋${v('PC')}＋${v('PD')}＝3${v('PG')}<\/div><\/div><div class=\"callout\">括号中的三项相加为 0，留下<strong>三份 PG<\/strong>。下方动画展示为什么能相消。<\/div>`},\n{title:'向量等长反向，P 就是中点',scene:'沿 AG 寻找满足条件的 P',detail:'两条向量何时恰好抵消？',hint:'橙色 PA · 绿色 PG',caption:'在中点，两条向量等长反向；偏离中点后，题设条件不再成立。',html:`<p class=\"lead\">把上一步的结果代入题设，再同时除以 3：<\/p><div class=\"math-stack\"><div class=\"math-row math\">3${v('PA')}＋3${v('PG')}＝${v('0')}<\/div><div class=\"math-row math\">${v('PA')}＋${v('PG')}＝${v('0')}<\/div><div class=\"math-row math\">${v('PA')}＝−${v('PG')}<\/div><div class=\"equation\">A、P、G 共线，且 PA＝PG<\/div><\/div><div class=\"callout\"><strong>P 是 AG 的中点。<\/strong>拖动滑块可以验证：只有停在 50%，两条向量才恰好抵消。<\/div>`},\n{title:'同一个底面，高度恰好减半',scene:'比较 A 与 P 到底面的距离',detail:'剖面：把斜线 AG 与垂直高度分开',hint:'AH⊥底面，PK⊥底面',caption:'PK∥AH，且 GP / GA＝1/2，由相似三角形得到 PK / AH＝1/2。',html:`<p class=\"lead\">分别从 A、P 向底面作垂线 AH、PK。P 是 AG 的中点，所以 PK 的长度是 AH 的一半。<\/p><div class=\"math-stack\"><div class=\"math-row math\">△GPK ∽ △GAH<\/div><div class=\"math-row math\">h<sub>P<\/sub> / h<sub>A<\/sub>＝GP / GA＝1/2<\/div><div class=\"equation math\">h<sub>P<\/sub>＝h<sub>A<\/sub> / 2<\/div><\/div><div class=\"callout\"><strong>AG 通常是斜线。<\/strong>图中虚线才是垂直高度。若 AG⊥底面，高度就是 AG、PG，比例仍为 1:2。<\/div>`},\n{title:'底面积相同，体积也是一半',scene:'突出显示所求四面体 PBCD',detail:'同底面的体积比较',hint:'V＝底面积 × 高 ÷ 3',caption:'把顶点 A 换成中点 P，底面不变，高度与体积都变为原来的 1/2。',html:`<p class=\"lead\">四面体 ABCD 与 PBCD 的底面积相同。相除时，底面积和 1/3 都消掉，只剩高度比。<\/p><div class=\"math-stack\"><div class=\"math-row math\">V<sub>PBCD<\/sub> / V<sub>ABCD<\/sub>＝h<sub>P<\/sub> / <\/span><\/button>\n<button class=\"step\" data-step=\"1\"><span class=\"number\">02<\/span><span class=\"step-name\">看竖直分量<\/span><\/button>\n<button class=\"step\" data-step=\"2\"><span class=\"number\">03<\/span><span class=\"step-name\">系数参与平衡<\/span><\/button>\n<button class=\"step\" data-step=\"3\"><span class=\"number\">04<\/span><span class=\"step-name\">解出高度比<\/span><\/button>\n<button class=\"step\" data-step=\"4\"><span class=\"number\">05<\/span><span class=\"step-name\">得到所求体积<\/span><\/button>\n<\/nav>\n<div class=\"workspace\">\n<section class=\"scene-panel\" aria-label=\"可旋转的四面体动画\">\n<div class=\"scene-top\"><span class=\"scene-title\"><span class=\"live-dot\"><\/span><span id=\"sceneTitle\">两个四面体，共同底面 BCD<\/span><\/span><span id=\"status\" class=\"status-badge\">V(ABCD)＝24<\/span><\/div>\n<div class=\"scene-wrap\"><canvas id=\"space\" class=\"scene-canvas\" tabindex=\"0\" role=\"img\" aria-label=\"四面体及垂直高度的三维动画。拖动旋转，滚轮缩放，也可使用方向键旋转。\"><\/canvas><div class=\"scene-note\">拖动旋转 · 滚轮缩放 · 方向键也可调整<\/div><\/div>\n<div class=\"scene-legend\"><span><i class=\"swatch\" style=\"background:#8eb9c9\"><\/i>共同底面 BCD<\/span><span id=\"vectorLegend\" hidden><i class=\"swatch\" style=\"background:#b7a2d1\"><\/i>PB、PC、PD<\/span><span id=\"heightLegend\"><i class=\"swatch\" style=\"background:#e9a17e\"><\/i>垂直高度 h、x<\/span><span id=\"volumeLegend\" hidden><i class=\"swatch\" style=\"background:#73b6a4\"><\/i>四面体 PBCD<\/span><\/div>\n<div class=\"control-panel\">\n<div id=\"projectionControls\" hidden><div class=\"control-label\"><label for=\"projection\">取出每条向量的竖直分量<\/label><output id=\"projectionValue\" for=\"projection\">0%<\/output><\/div><input id=\"projection\" type=\"range\" min=\"0\" max=\"100\" step=\"0.1\" value=\"0\"><div class=\"range-scale\"><span class=\"left\">空间向量<\/span><span class=\"right\">竖直分量<\/span><\/div><\/div>\n<div id=\"heightControls\" hidden><div class=\"control-label\"><label for=\"height\">移动 P，比较向上与向下总量<\/label><output id=\"heightValue\" for=\"height\">x/h＝1/3<\/output><\/div><input id=\"height\" type=\"range\" min=\"0\" max=\"300\" step=\"1\" value=\"100\" aria-label=\"P 的高度比例，100 对应高度为原来的三分之一\"><div class=\"range-scale\"><span class=\"left\">x＝0<\/span><span class=\"target\">题设位置 · h/3<\/span><span class=\"right\">x＝h<\/span><\/div><div class=\"control-actions\"><span class=\"signs\">向上取正，向下取负<\/span><button id=\"satisfy\" type=\"button\">回到题设位置<\/button><\/div><\/div>\n<div id=\"lockedControls\" class=\"locked-controls\"><p id=\"lockedText\">设 A、P 到平面 BCD 的距离为 h、x。<\/p><button id=\"view\" type=\"button\">正对高度剖面<\/button><\/div>\n<\/div>\n<\/section>\n<aside class=\"lesson-panel\" aria-label=\"当前步骤的思路与计算\">\n<div class=\"chapter\" id=\"chapter\">STEP 01 / 05<\/div><h2 id=\"lessonTitle\">底面相同，所求就是高度比<\/h2><div id=\"lessonContent\"><\/div>\n<div class=\"detail-head\"><strong id=\"detailTitle\">剖面：到同一平面的两条垂线<\/strong><span id=\"detailHint\">h＝AH，x＝PK<\/span><\/div>\n<canvas id=\"detail\" class=\"detail-canvas\" role=\"img\" aria-label=\"与当前步骤同步的竖直分量与高度比例动画\"><\/canvas><p id=\"detailCaption\" class=\"detail-caption\"><\/p>\n<\/aside>\n<\/div>\n<div class=\"footer-controls\"><div class=\"play-group\"><button id=\"play\" class=\"primary\" type=\"button\">▶ 自动演示<\/button><span id=\"autoState\" class=\"auto-state\">跟着五步，看一遍完整思路<\/span><\/div><div class=\"navigation\"><button id=\"previous\" type=\"button\" disabled>← 上一步<\/button><button id=\"next\" type=\"button\">下一步 →<\/button><\/div><\/div>\n<div class=\"footer-line\"><span>核心方法：共同底面 → 竖直分量 → 高度方程 → 体积比<\/span><span>图形为示意；结论适用于任意非退化四面体<\/span><\/div>\n<p id=\"announce\" class=\"screen-reader\" aria-live=\"polite\"><\/p>\n<\/main>\n<script>\n(() => {\n'use strict';\nconst $=id=>document.getElementById(id),v=name=>`<span class=\"vec\">${name}<\/span>`;\nconst unit=Math.cbrt(6),A=[-.6,.5,2].map(x=>x*unit),B=[-2,-1,0].map(x=>x*unit),C=[2,-1,0].map(x=>x*unit),D=[.4,2,0].map(x=>x*unit);\nconst add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,k)=>a.map(x=>x*k),lerp=(a,b,t)=>add(a,mul(sub(b,a),t));\nconst weighted=mul(add(add(mul(A,3),B),add(mul(C,2),mul(D,3))),1/9),H=[A[0],A[1],0],K=[weighted[0],weighted[1],0];\nconst state={step:0,t:1/3,projection:0,height:1,volume:0,yaw:-.4,pitch:.38,zoom:1,front:false,playing:false};\nconst palette={ink:'#26373b',muted:'#718080',blue:'#528ba8',orange:'#df7743',teal:'#137c72',purple:'#8366b8',paper:'#fffefb'};\nconst P=()=>[weighted[0],weighted[1],A[2]*state.t];\nconst lessons=[\n{title:'底面相同，所求就是高度比',scene:'两个四面体，共同底面 BCD',detail:'剖面：到同一平面的两条垂线',hint:'h＝AH，x＝PK',caption:'两条虚线都垂直于底面。先把所求体积转化为 x/h。',html:`<p class=\"lead\">以 △BCD 为共同底面。设 A 到底面的高度为 h，P 到底面的高度为 x。<\/p><div class=\"math-stack\"><div class=\"math-row math\">V<sub>ABCD<\/sub>＝S<sub>BCD<\/sub>·h / 3<\/div><div class=\"math-row math\">V<sub>PBCD<\/sub>＝S<sub>BCD<\/sub>·x / 3<\/div><div class=\"equation math\">V<sub>PBCD<\/sub> / V<sub>ABCD<\/sub>＝x/h<\/div><\/div><div class=\"callout\">设朝向 A 的方向为正。由题设系数全为正，P 是四个顶点的加权平均点，<strong>位于四面体内部<\/strong>，故 0＜x＜h。<\/div>`},\n{title:'三条不同方向的向量，竖直分量相同',scene:'从 P 出发，分离竖直与水平运动',detail:'只看竖直方向：向上为正',hint:'B、C、D 的高度都是 0',caption:'从高度 x 出发，走到 B、C、D，都下降 x；走到 A，则上升 h−x。',html:`<p class=\"lead\">向量的竖直分量等于“终点高度减起点高度”。B、C、D 虽然位置不同，但都在高度为 0 的底面上。<\/p><div class=\"math-stack\"><div class=\"math-row math\">${v('PA')} 的竖直分量：h−x<\/div><div class=\"math-row math\">${v('PB')}、${v('PC')}、${v('PD')} 的竖直分量：<\/div><div class=\"equation math\">0−x＝−x<\/div><\/div><div class=\"callout\">向量和为 0，意味着<strong>竖直分量之和也必须为 0<\/strong>。利用这一点就足够求体积。<\/div>`},\n{title:'系数乘上分量，向上与向下要平衡',scene:'移动 P，直到向上总量等于向下总量',detail:'两种总量何时大小相等？',hint:'橙色向上 · 紫色向下',caption:'下方三段分别表示 x、2x、3x，总下降量是 6x。只有 x/h＝1/3 时平衡。',html:`<p class=\"lead\">把系数分别乘进竖直分量。原来的四条空间向量，变成一个带正负号的标量方程。<\/p><div class=\"math-stack\"><div class=\"math-row math\">向上总量：3(h−x)<\/div><div class=\"math-row math\">向下总量：x＋2x＋3x＝6x<\/div><div class=\"equation compact math\">3(h−x)−x−2x−3x＝0<\/div><\/div><div class=\"callout\">拖动 P 的高度，看两种总量怎样变化。<strong>系数 1、2、3 必须全部计入。<\/strong><\/div>`},\n{title:'整理方程，得到高度的三分之一',scene:'题设位置：P 的高度为 h/3',detail:'高度比较：x/h＝1/3',hint:'两条高度均垂直底面',caption:'这里得到的是垂直高度比；不需要求 P 到 A、B、C、D 的实际距离。',html:`<p class=\"lead\">由竖直方向的平衡方程：<\/p><div class=\"math-stack\"><div class=\"math-row math\">3(h−x)＝6x<\/div><div class=\"math-row math\">3h−3x＝6x<\/div><div class=\"math-row math\">3h＝9x<\/div><div class=\"equation math\">x/h＝3/9＝1/3<\/div><\/div><div class=\"callout\">分母的 9，来自<strong>所有系数相加：3＋1＋2＋3<\/strong>。分子的 3，来自顶点 A 对应的系数。<\/div>`},\n{title:'高度变为三分之一，体积也是',scene:'所求四面体 PBCD 的体积',detail:'同底面的体积比较',hint:'体积比＝高度比',caption:'共同底面不变，高度为原来的 1/3，因此体积也是原来的 1/3。',html:`<p class=\"lead\">两个四面体的底面都是 BCD，将高度比直接代入体积比。<\/p><div class=\"math-stack\"><div class=\"math-row math\">V<sub>PBCD<\/sub> / V<sub>ABCD<\/sub>＝x/h＝1/3<\/div><\/div><div class=\"answer\"><small>本题答案<\/small>V<sub>PBCD<\/sub>＝24 × <span class=\"frac\"><span>1<\/span><span>3<\/span><\/span>＝8<\/div><div class=\"callout\">本题也可直接读成：<strong>A 的系数 ÷ 全部系数之和<\/strong>，即 3 ÷ (3＋1＋2＋3)＝1/3。<\/div>`}\n];\nconst space=$('space'),detail=$('detail'),ctx=space.getContext('2d'),dctx=detail.getContext('2d');\nlet width=0,height=0,dw=0,dh=0,dpr=1,drawPending=false,frame=0,animationId=0,autoTimer=0;\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction requestDraw(){if(!drawPending){drawPending=true;requestAnimationFrame(()=>{drawPending=false;draw();});}}\nfunction resize(){dpr=Math.min(devicePixelRatio||1,2);const r=space.getBoundingClientRect(),s=detail.getBoundingClientRect();width=r.width;height=r.height;dw=s.width;dh=s.height;for(const[c,w,h]of[[space,width,height],[detail,dw,dh]]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}requestDraw();}\nnew ResizeObserver(resize).observe(space);new ResizeObserver(resize).observe(detail);\nfunction projection(){const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch),scale=Math.min(width/5.5,height/4.2)*state.zoom/unit,center=mul([0,.25,.75],unit);const p=v=>{const[x,y,z]=sub(v,center);return[width/2+scale*(cy*x-sy*y),height/2+scale*(sp*(sy*x+cy*y)-cp*z)];};p.depth=v=>cp*(sy*v[0]+cy*v[1])+sp*v[2];p.scale=scale;return p;}\nfunction path(c,pts,closed=false){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));if(closed)c.closePath();}\nfunction line(c,a,b,color,w=1.5,dash=[]){c.save();c.strokeStyle=color;c.lineWidth=w;c.setLineDash(dash);path(c,[a,b]);c.stroke();c.restore();}\nfunction poly(c,pts,fill,stroke,w=1.4,dash=[]){c.save();path(c,pts,true);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.setLineDash(dash);c.stroke();}c.restore();}\nfunction dot(c,p,color,r=3.5){c.beginPath();c.arc(...p,r,0,Math.PI*2);c.fillStyle=color;c.fill();c.strokeStyle=palette.paper;c.lineWidth=1.5;c.stroke();}\nfunction label(c,text,p,dx=0,dy=0,color=palette.ink,size=14,align='center'){c.save();c.font=`500 ${size}px \"Segoe UI\",\"Microsoft YaHei\",sans-serif`;c.textAlign=align;c.textBaseline='middle';c.strokeStyle=palette.paper;c.lineWidth=4;c.lineJoin='round';c.strokeText(text,p[0]+dx,p[1]+dy);c.fillStyle=color;c.fillText(text,p[0]+dx,p[1]+dy);c.restore();}\nfunction arrow(c,a,b,color,w=2.2,dash=[]){line(c,a,b,color,w,dash);const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<7)return;const head=Math.min(8,len*.24),ux=dx/len,uy=dy/len;poly(c,[b,[b[0]-ux*head-uy*head*.43,b[1]-uy*head+ux*head*.43],[b[0]-ux*head+uy*head*.43,b[1]-uy*head-ux*head*.43]],color,null);}\nfunction right3(p,q){const a=[.11*unit,0,0],b=[0,0,.11*unit];poly(ctx,[p(add(q,a)),p(add(add(q,a),b)),p(add(q,b))],null,palette.orange,1.1);}\nfunction drawSpace(){\nctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const p=projection(),pp=P();\nfor(let i=-2;i<=2;i++){line(ctx,p(mul([i,-1.5,0],unit)),p(mul([i,2.4,0],unit)),'#e9ede5',.7);line(ctx,p(mul([-2.5,i,0],unit)),p(mul([2.5,i,0],unit)),'#e9ede5',.7);}\nconst exterior=[[A,B,C],[A,C,D],[A,D,B]];exterior.sort((a,b)=>a.reduce((s,v)=>s+p.depth(v),0)-b.reduce((s,v)=>s+p.depth(v),0));exterior.forEach(f=>poly(ctx,f.map(p),'#d6dfd219',null));\npoly(ctx,[B,C,D].map(p),'#83b4ca31',palette.blue,1.7);\nfor(const q of[B,C,D])line(ctx,p(A),p(q),state.step===4?'#7e929380':'#829294',1.4,state.step===4?[5,4]:[]);\nif(state.step===0||state.step>=3){const faces=[[pp,B,C],[pp,C,D],[pp,D,B]];faces.sort((a,b)=>a.reduce((s,v)=>s+p.depth(v),0)-b.reduce((s,v)=>s+p.depth(v),0));faces.forEach(f=>poly(ctx,f.map(p),`rgba(48,145,119,${state.step===4?.12+.09*state.volume:.09})`,palette.teal,1.4));}\nif(state.step===1){\nconst u=state.projection,ua=[pp[0],pp[1],A[2]],ba=[pp[0],pp[1],0];\nfor(const[name,q,col]of[['PA',A,palette.orange],['PB',B,palette.purple],['PC',C,palette.purple],['PD',D,palette.purple]]){\nctx.save();ctx.globalAlpha=1-u*.75;arrow(ctx,p(pp),p(q),col,1.6);ctx.restore();const target=name==='PA'?ua:ba;const endpoint=lerp(q,target,u);arrow(ctx,p(pp),p(endpoint),col,2);if(u>.05)line(ctx,p(q),p(endpoint),'#a4b9ae99',1,[3,4]);\n}\nif(u>.9){label(ctx,'h − x',p(lerp(pp,ua,.5)),24,-2,palette.orange,13);label(ctx,'−x',p(lerp(pp,ba,.5)),18,0,palette.purple,13);dot(ctx,p(ua),palette.orange,2.8);}\n}\nif(state.step!==1){line(ctx,p(A),p(lerp(A,H,state.height)),palette.orange,2,[5,4]);line(ctx,p(pp),p(lerp(pp,K,state.height)),palette.orange,2.5,[5,4]);if(state.height>.95){right3(p,H);right3(p,K);dot(ctx,p(H),palette.orange,2.5);dot(ctx,p(K),palette.orange,2.5);label(ctx,'H',p(H),-7,15,palette.orange,13);label(ctx,'K',p(K),7,15,palette.orange,13);label(ctx,'h',p(lerp(A,H,.47)),-14,0,palette.orange,15);label(ctx,state.step>=3?'h/3':'x',p(lerp(pp,K,.5)),22,0,palette.orange,14);}}\nif(state.step===2){line(ctx,p(pp),p([pp[0],pp[1],A[2]]),palette.orange,2,[4,4]);label(ctx,'h − x',p(lerp(pp,[pp[0],pp[1],A[2]],.5)),29,0,palette.orange,13);}\nfor(const[name,q,col,dx,dy]of[['A',A,palette.ink,0,-17],['B',B,palette.blue,-14,5],['C',C,palette.blue,14,5],['D',D,palette.blue,8,16],['P',pp,palette.orange,13,-5]]){dot(ctx,p(q),col,4);label(ctx,name,p(q),dx,dy,col,15);}\n}\nfunction drawHeights(){\nconst bottom=dh-33,top=27,ax=dw*.29,px=dw*.69,py=bottom-(bottom-top)*state.t;\nline(dctx,[22,bottom],[dw-22,bottom],'#a3b8ac',1.3);line(dctx,[ax,top],[ax,bottom],palette.orange,2,[5,4]);line(dctx,[px,py],[px,bottom],palette.teal,2.4,[5,4]);\npoly(dctx,[[ax,bottom-8],[ax+8,bottom-8],[ax+8,bottom]],null,palette.orange,1);poly(dctx,[[px,bottom-8],[px+8,bottom-8],[px+8,bottom]],null,palette.teal,1);\nfor(const[name,pt,col,dy]of[['A',[ax,top],palette.ink,-14],['P',[px,py],palette.orange,-14],['H',[ax,bottom],palette.orange,16],['K',[px,bottom],palette.teal,16]]){dot(dctx,pt,col,3);label(dctx,name,pt,0,dy,col,13);}\nlabel(dctx,'h',[ax,(top+bottom)/2],-18,0,palette.orange,15);label(dctx,state.step>=3?'h/3':'x',[px,(py+bottom)/2],23,0,palette.teal,14);line(dctx,[ax+8,top],[dw-18,top],'#b5c9bc66',1,[3,4]);\n}\nfunction drawComponents(){\nconst top=33,bottom=dh-35,y=bottom-(bottom-top)*state.t;const xs=[dw*.14,dw*.38,dw*.62,dw*.86];\nline(dctx,[18,y],[dw-18,y],'#b8c9bd',1,[3,4]);\nfor(let i=0;i<4;i++){const x=xs[i],up=i===0,end=up?top:bottom,col=up?palette.orange:palette.purple;arrow(dctx,[x,y],[x,end],col,2.3);label(dctx,['PA','PB','PC','PD'][i],[x,17],0,0,palette.ink,13);label(dctx,up?'h−x':'−x',[x,up?(top+y)/2:(bottom+y)/2],up?20:16,0,col,12);dot(dctx,[x,y],palette.muted,2.5);}\nlabel(dctx,'P 的高度 x',[dw/2,y],0,-13,palette.muted,11);\n}\nfunction drawBalance(){\nconst t=state.t,up=3*(1-t),down=6*t,y=dh*.49,maxLen=dh*.36,scale=maxLen/Math.max(up,down,.01),lx=dw*.25,rx=dw*.62,good=Math.abs(t-1/3)<1e-7;\nline(dctx,[15,y],[dw-15,y],'#bdcbbf',1,[3,4]);arrow(dctx,[lx,y],[lx,y-up*scale],palette.orange,3.2);label(dctx,'3(h−x)',[lx,y-up*scale],0,-15,palette.orange,13);dot(dctx,[lx,y],palette.orange,3);\nconst shades=['#967bb9','#8366b8','#70539f'];let start=y;\nfor(let i=0;i<3;i++){const len=(i+1)*t*scale,end=start+len;line(dctx,[rx,start],[rx,end],shades[i],5);if(len>9){line(dctx,[rx-5,end],[rx+5,end],palette.paper,1.5);label(dctx,['x','2x','3x'][i],[rx+18,(start+end)/2],0,0,palette.purple,12,'left');}start=end;}\narrow(dctx,[rx,y],[rx,y+down*scale],palette.purple,1.2);dot(dctx,[rx,y],palette.purple,3);label(dctx,'6x',[rx,y+down*scale],0,15,palette.purple,13);\nconst note=good?'大小相等：满足题设':up>down?'向上总量较大':'向下总量较大';label(dctx,note,[dw*.75,23],0,0,good?palette.teal:palette.muted,11);\n}\nfunction drawVolumes(){const left=18,right=dw-18,w=right-left,y1=55,y2=130,h=23;label(dctx,'ABCD',[left,y1-20],0,0,palette.ink,13,'left');label(dctx,'24',[right,y1-20],0,0,palette.ink,14,'right');dctx.fillStyle=palette.blue;dctx.fillRect(left,y1,w,h);label(dctx,'PBCD',[left,y2-20],0,0,palette.ink,13,'left');label(dctx,'8',[right,y2-20],0,0,palette.teal,14,'right');dctx.fillStyle='#e4eee6';dctx.fillRect(left,y2,w,h);dctx.fillStyle=palette.teal;dctx.fillRect(left,y2,w/3*state.volume,h);label(dctx,'共同底面 × 三分之一高度',[dw/2,dh-18],0,0,palette.muted,12);}\nfunction drawDetail(){dctx.setTransform(dpr,0,0,dpr,0,0);dctx.clearRect(0,0,dw,dh);if(state.step===0||state.step===3)drawHeights();if(state.step===1)drawComponents();if(state.step===2)drawBalance();if(state.step===4)drawVolumes();}\nfunction sync(){\n$('projection').value=state.projection*100;$('projectionValue').textContent=`${Math.round(state.projection*100)}%`;$('height').value=state.t*300;\nconst good=Math.abs(state.t-1/3)<1e-7;$('heightValue').textContent=good?'x/h＝1/3':`x/h＝${state.t.toFixed(3)}`;$('status').classList.toggle('solved',state.step>=2&&good);\n$('status').textContent=state.step<2?'V(ABCD)＝24':state.step===2?(good?'满足题设：x/h＝1/3':'探索中：当前不满足题设'):state.step===3?'x/h＝1/3':'V(PBCD)＝8';\n}\nfunction draw(){if(!width||!dw)return;sync();drawSpace();drawDetail();}\nfunction stopAnimation(){cancelAnimationFrame(frame);animationId++;}\nfunction tween(properties,duration,done){stopAnimation();const id=animationId,start=performance.now(),from={};Object.keys(properties).forEach(k=>from[k]=state[k]);if(reduceMotion){Object.assign(state,properties);requestDraw();if(done)done();return;}function tick(now){if(id!==animationId)return;const t=Math.min((now-start)/duration,1),e=t<.5?2*t*t:1-(-2*t+2)**2/2;Object.entries(properties).forEach(([k,v])=>state[k]=t===1?v:from[k]+(v-from[k])*e);draw();if(t<1)frame=requestAnimationFrame(tick);else if(done)done();}frame=requestAnimationFrame(tick);}\nfunction setStep(i,animate=true){\nstopAnimation();state.step=Math.max(0,Math.min(4,i));i=state.step;const l=lessons[i];$('chapter').textContent=`STEP 0${i+1} / 05`;$('lessonTitle').textContent=l.title;$('lessonContent').innerHTML=l.html;$('sceneTitle').textContent=l.scene;$('detailTitle').textContent=l.detail;$('detailHint').textContent=l.hint;$('detailCaption').textContent=l.caption;\ndocument.querySelectorAll('.step').forEach((b,j)=>{b.classList.toggle('done',j<i);if(i===j)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});$('previous').disabled=i===0;$('next').disabled=i===4;$('projectionControls').hidden=i!==1;$('heightControls').hidden=i!==2;$('lockedControls').hidden=i===1||i===2;$('vectorLegend').hidden=i!==1;$('heightLegend').hidden=i===1;$('volumeLegend').hidden=i!==4;\n$('lockedText').textContent=i===0?'设 A、P 到平面 BCD 的距离为 h、x。':i===3?'题设已确定：P 到底面的高度为 h/3。':'同底面，高度为原来的 1/3，体积也是。';state.front=false;state.yaw=-.4;state.pitch=.38;state.zoom=1;$('view').textContent='正对高度剖面';state.t=1/3;state.projection=0;state.height=1;state.volume=0;\nif(i===1){state.projection=animate?0:1;if(animate)tween({projection:1},3000);}if(i===2){state.t=animate?.62:1/3;if(animate)tween({t:1/3},3400);}if(i===4){state.volume=animate?0:1;if(animate)tween({volume:1},1800);}\n$('announce').textContent=`第 ${i+1} 步：${l.title}`;requestDraw();\n}\nfunction stopAuto(){clearTimeout(autoTimer);state.playing=false;$('play').textContent='▶ 自动演示';$('autoState').textContent='跟着五步，看一遍完整思路';}\nfunction scrollScene(){if(matchMedia('(max-width:780px)').matches)document.querySelector('.scene-panel').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});}\nfunction manual(i){stopAuto();setStep(i);scrollScene();}\ndocument.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>manual(Number(b.dataset.step))));$('previous').addEventListener('click',()=>manual(state.step-1));$('next').addEventListener('click',()=>manual(state.step+1));\n$('projection').addEventListener('input',e=>{stopAuto();stopAnimation();state.projection=Number(e.target.value)/100;draw();});$('projection').addEventListener('change',()=>{$('announce').textContent=`竖直分量显示进度 ${Math.round(state.projection*100)}%。`;});\n$('height').addEventListener('input',e=>{stopAuto();stopAnimation();state.t=Number(e.target.value)/300;draw();});$('height').addEventListener('change',()=>{$('announce').textContent=Math.abs(state.t-1/3)<1e-7?'P 的高度是 h/3，向上与向下总量相等。':`P 的高度占原高度的 ${(state.t*100).toFixed(1)}%，当前不满足题设。`;});\n$('satisfy').addEventListener('click',()=>{stopAuto();tween({t:1/3},900);$('announce').textContent='回到题设位置，P 的高度为 h/3。';});\n$('play').addEventListener('click',()=>{if(state.playing){stopAuto();stopAnimation();return;}state.playing=true;$('play').textContent='Ⅱ 暂停演示';$('autoState').textContent='自动播放中，可随时拖动或切换步骤';setStep(0);scrollScene();const delays=[8000,10000,11000,8500,6500];function advance(){if(!state.playing)return;if(state.step===4){stopAuto();$('autoState').textContent='演示结束，可点击任一步回看';return;}setStep(state.step+1);autoTimer=setTimeout(advance,delays[state.step]);}autoTimer=setTimeout(advance,delays[0]);});\n$('view').addEventListener('click',()=>{state.front=!state.front;$('view').textContent=state.front?'回到空间视角':'正对高度剖面';tween({yaw:state.front?0:-.4,pitch:state.front?0:.38},650);});\nlet pointer=null;space.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY};space.setPointerCapture(e.pointerId);});space.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;stopAuto();state.yaw+=(e.clientX-pointer.x)*.009;state.pitch=Math.max(-1.3,Math.min(1.3,state.pitch+(e.clientY-pointer.y)*.009));pointer.x=e.clientX;pointer.y=e.clientY;state.front=false;$('view').textContent='正对高度剖面';requestDraw();});for(const e of['pointerup','pointercancel','lostpointercapture'])space.addEventListener(e,()=>pointer=null);\nspace.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.65,Math.min(1.65,state.zoom*Math.exp(-e.deltaY*.001)));requestDraw();},{passive:false});space.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')state.yaw-=.1;if(e.key==='ArrowRight')state.yaw+=.1;if(e.key==='ArrowUp')state.pitch=Math.max(-1.3,state.pitch-.1);if(e.key==='ArrowDown')state.pitch=Math.min(1.3,state.pitch+.1);requestDraw();});\nwindow.weightedVolumeLesson={getState:()=>({...state}),getGeometry:()=>({A:[...A],B:[...B],C:[...C],D:[...D],P:P(),H:[...H],K:[...K],fullVolume:24,targetVolume:24*state.t,heightRatio:state.t,upward:3*(1-state.t),downward:6*state.t,residual:add(add(mul(sub(A,P()),3),sub(B,P())),add(mul(sub(C,P()),2),mul(sub(D,P()),3)))})};\nsetStep(0,false);resize();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}]</script>
<script>
(() => {
'use strict';
const lessons=JSON.parse(document.getElementById('lesson-data').textContent);
const keys=['folding','vectors','weighted'],titles=['菱形折叠与外接球','向量合并与体积','带权向量与体积'];
const tabs=Array.from(document.querySelectorAll('.question-tab'));
const panels=keys.map(key=>document.getElementById('panel-'+key));
const frames=[null,null,null],observers=[null,null,null],ready=[false,false,false];
const region=document.getElementById('lesson-region'),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let active=-1;
function childState(i){const win=frames[i]?.contentWindow;if(!win)return null;try{return (win.geometryLesson||win.vectorVolumeLesson||win.weightedVolumeLesson)?.getState()||null;}catch{return null;}}
function pause(i){if(i<0||!frames[i])return;if(childState(i)?.playing){frames[i].contentDocument.getElementById('play')?.click();}}
function fit(i){const frame=frames[i];if(!frame||panels[i].hidden)return;const body=frame.contentDocument?.body;if(!body)return;const desired=Math.max(300,Math.ceil(body.getBoundingClientRect().height));if(Math.abs(frame.getBoundingClientRect().height-desired)>1)frame.style.height=desired+'px';}
function mount(i){
if(frames[i]){requestAnimationFrame(()=>fit(i));return;}
const frame=document.createElement('iframe');frames[i]=frame;frame.id='lesson-frame-'+i;frame.className='lesson-frame';frame.title='第 '+(i+1)+' 题：'+titles[i];frame.setAttribute('scrolling','no');
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc?.body)return;ready[i]=true;document.getElementById('loading-'+keys[i]).hidden=true;frame.classList.add('ready');observers[i]=new ResizeObserver(()=>fit(i));observers[i].observe(doc.body);
doc.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||i!==active)return;const navigation=button.classList.contains('step')||['previous','next'].includes(button.id)||(button.id==='play'&&childState(i)?.playing);if(navigation&&matchMedia('(max-width:780px)').matches)requestAnimationFrame(()=>{fit(i);const scene=doc.querySelector('.scene-panel');if(scene){const top=scrollY+frame.getBoundingClientRect().top+scene.getBoundingClientRect().top-12;scrollTo({top:Math.max(0,top),behavior:reduceMotion?'auto':'smooth'});}});});
requestAnimationFrame(()=>{fit(i);requestAnimationFrame(()=>fit(i));});});
// Each lesson is stored in this file. Separate documents preserve its controls and drawing state.
frame.srcdoc=lessons[i].html;panels[i].appendChild(frame);
}
function select(i,{scroll=false,hash=true}={}){
if(i<0||i>=lessons.length)return;
if(active!==i)pause(active);active=i;
tabs.forEach((tab,j)=>{tab.setAttribute('aria-selected',String(j===i));tab.tabIndex=j===i?0:-1;panels[j].hidden=j!==i;});
document.getElementById('previous-question').disabled=i===0;document.getElementById('next-question').disabled=i===lessons.length-1;
document.getElementById('collection-announcement').textContent='第 '+(i+1)+' 题：'+titles[i];mount(i);
if(hash){try{history.replaceState(null,'','#'+keys[i]);}catch{location.hash=keys[i];}}
if(scroll)requestAnimationFrame(()=>region.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'}));
}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(i));tab.addEventListener('keydown',e=>{let target=i;if(e.key==='ArrowRight'||e.key==='ArrowDown')target=(i+1)%tabs.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')target=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')target=0;else if(e.key==='End')target=tabs.length-1;else return;e.preventDefault();select(target);tabs[target].focus();});});
document.getElementById('previous-question').addEventListener('click',()=>select(active-1,{scroll:true}));document.getElementById('next-question').addEventListener('click',()=>select(active+1,{scroll:true}));
document.getElementById('back-top').addEventListener('click',e=>{e.preventDefault();document.getElementById('choose-question').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});});
addEventListener('hashchange',()=>{const target=keys.indexOf(location.hash.slice(1));if(target!==-1&&target!==active)select(target,{hash:false});});
function orientation(){document.querySelector('.question-tabs').setAttribute('aria-orientation',matchMedia('(max-width:700px)').matches?'vertical':'horizontal');}
addEventListener('resize',()=>{orientation();if(active>=0)requestAnimationFrame(()=>fit(active));});
window.geometryCollection={getState:()=>({active:keys[active],loaded:ready.slice(),lessonStates:keys.map((key,i)=>({key,state:childState(i)}))})};
orientation();const initial=keys.indexOf(location.hash.slice(1));select(initial<0?0:initial,{hash:false});
})();
</script>
</body>
